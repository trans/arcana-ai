  - provider: anthropic
    model: claude-haiku-5-5
    input: 0.10
    cache_write: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
    output: 0.50
    long: {above: 100000, input: 0.50, cache_write: 0.625, cache_write_1h: 1, cache_read: 0.05, output: 2.50}
    geo: {us: 1.1}
  - {provider: anthropic, model: claude-haiku-4-5-20251001, aliases: [claude-haiku-4-5], input: 1, cache_write: 1.25, cache_write_1h: 2, cache_read: 0.10, output: 5}
  - {provider: anthropic, model: claude-3-5-haiku-20241022, aliases: [claude-3-5-haiku-latest], input: 0.80, cache_write: 1, cache_write_1h: 1.60, cache_read: 0.08, output: 4}

