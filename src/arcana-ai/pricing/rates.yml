  # Images API. Cached input never applies to GPT Image 2 and 2.5 through
  # the Images API, so their reported tokens are the whole bill.
  # gpt-image-1, -1-mini, -1.5 and chatgpt-image-latest are left out: they
  # have cached rates, but their usage never reports cached tokens, so
  # their cost can't be known. (They shut down by 2026-12-01.)
  - {provider: openai, model: gpt-image-2.5-sunburst, input: 5, image_input: 8, image_output: 30}
  - {provider: openai, model: gpt-image-2.5-flare, input: 5, image_input: 8, image_output: 30}
  - {provider: openai, model: gpt-image-2, input: 5, image_input: 8, image_output: 30}

  # Speech; its usage comes only with stream_format "sse". tts-1 and
  # tts-1-hd bill per character and report no usage. All three shut down
  # on 2027-01-06.
  - {provider: openai, model: gpt-4o-mini-tts, input: 0.60, audio_output: 12}

