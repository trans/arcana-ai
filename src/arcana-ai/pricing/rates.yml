# List prices for the models arcana-ai talks to, in USD, from the
# providers' pricing pages. `version` names this edition by the day it was
# last checked; a section checked on an earlier day says so.
#
#   anthropic  https://platform.claude.com/docs/en/about-claude/pricing
#   openai     https://developers.openai.com/api/docs/pricing
#   gemini     https://ai.google.dev/gemini-api/docs/pricing (paid tier)
#   voyage     https://docs.voyageai.com/docs/pricing
#
# Token rates are per million tokens; web_search is per thousand searches,
# and credits per thousand credits, for providers that bill in credits.
# cache_write is the provider's standard cache-write rate (Anthropic's
# 5-minute writes, OpenAI's writes); cache_write_1h is Anthropic's 1-hour
# writes. image_input, image_output and audio_output are for models that
# price image or audio tokens apart from text (input and output are then
# text). A rate left out means the model has none: usage in that category
# leaves a call unpriced, never guessed.
#
#   long:    other rates for prompts over `above` tokens, counting cache
#            reads and writes
#   geo:     multipliers by the region the provider reports serving a call in
#   since:   the first day (UTC) the rates apply
#   before:  the day (UTC) they stop applying
#   aliases: other IDs for the same model
#
# ElevenLabs isn't listed. It bills speech in credits, which its responses
# report (`usage.credits`), and what a credit costs depends on the plan.
# Its price page gives rates per character, but some models are charged
# less than a credit a character (eleven_v3 0.4, 2026-10-17), so those
# rates would overstate them. Give your plan's `credits` rate in a table
# of your own.
#
# Under `providers`, `web_search` applies to all of a provider's models,
# and `dated_snapshots` prices an ID ending in -YYYY-MM-DD as the model
# before it, unless that ID is listed itself.

version: arcana-ai 2026-10-13

providers:
  anthropic:
    web_search: 10
  openai:
    dated_snapshots: true

models:
  # -- Anthropic: Claude API (first-party), checked 2026-10-12.
